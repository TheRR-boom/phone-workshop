<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a5c"/>
      <stop offset="1" stop-color="#1a2430"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c5c48"/>
      <stop offset="1" stop-color="#0f3a2d"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5a5f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0b0f14"/>

  <!-- Корпус телефона в разрезе -->
  <rect x="128" y="52" width="256" height="408" rx="38" fill="url(#steel)" stroke="#56697d" stroke-width="6"/>
  <rect x="146" y="74" width="220" height="364" rx="26" fill="#0a1017"/>

  <!-- Плата -->
  <rect x="158" y="96" width="196" height="214" rx="10" fill="url(#pcb)"/>
  <g stroke="#3fae86" stroke-width="3" opacity="0.75">
    <path d="M168 130 H342 M168 168 H342 M168 206 H342 M168 244 H342 M168 282 H342"/>
    <path d="M190 106 V300 M232 106 V300 M276 106 V300 M318 106 V300"/>
  </g>

  <!-- Чипы -->
  <rect x="176" y="118" width="66" height="44" rx="6" fill="#0d1319" stroke="#4a6076" stroke-width="3"/>
  <rect x="258" y="118" width="54" height="34" rx="5" fill="#0d1319" stroke="#4a6076" stroke-width="3"/>
  <rect x="180" y="196" width="92" height="62" rx="7" fill="#0d1319" stroke="#4a6076" stroke-width="3"/>
  <rect x="290" y="196" width="48" height="48" rx="6" fill="#0d1319" stroke="#4a6076" stroke-width="3"/>

  <!-- Контакты и разъёмы -->
  <g fill="#c9a227">
    <circle cx="210" cy="282" r="5"/>
    <circle cx="232" cy="282" r="5"/>
    <circle cx="254" cy="282" r="5"/>
  </g>
  <rect x="286" y="270" width="52" height="22" rx="6" fill="#dfe8f0" opacity="0.85"/>

  <!-- Аккумулятор -->
  <rect x="160" y="322" width="192" height="98" rx="10" fill="#12382f" stroke="#2f7d61" stroke-width="3"/>
  <path d="M256 336 L232 378 H252 L240 408 L276 366 H256 Z" fill="#38e8a0" opacity="0.9"/>

  <!-- Дефект: короткое замыкание на чипе -->
  <circle cx="226" cy="227" r="34" fill="url(#spark)"/>
  <circle cx="226" cy="227" r="8" fill="#ffe6a8"/>

  <!-- Лупа -->
  <circle cx="318" cy="300" r="62" fill="#38e8a0" fill-opacity="0.10"/>
  <circle cx="318" cy="300" r="62" fill="none" stroke="#38e8a0" stroke-width="12"/>
  <line x1="364" y1="346" x2="412" y2="394" stroke="#38e8a0" stroke-width="22" stroke-linecap="round"/>

  <!-- Винт -->
  <circle cx="170" cy="82" r="15" fill="#9fb0c2"/>
  <circle cx="170" cy="82" r="7" fill="#0b0f14"/>
</svg>
