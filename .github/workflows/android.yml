name: Android APK (Godot)

# Сборка debug-APK без Godot-редактора: движок + шаблоны экспорта скачиваются
# на раннере, пресет уже лежит в репозитории, подпись — отладочным ключом.
# APK публикуется артефактом и прикрепляется к релизу.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Godot + шаблоны экспорта
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          curl -sL -o godot.zip "${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

          curl -sL -o templates.tpz "${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head

      - name: Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          SDKM="$(command -v sdkmanager || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Отладочный keystore
        run: |
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey -keypass android \
            -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12
          ls -lh debug.keystore

      - name: Настройки экспорта Godot
        run: |
          # Генерируем валидный editor_settings, затем подставляем пути SDK/JDK
          godot --headless --path . --editor --quit > /dev/null 2>&1 || true
          SETTINGS="$HOME/.config/godot/editor_settings-4.7.tres"
          test -f "$SETTINGS" || echo '[gd_resource type="EditorSettings" format=3]' > "$SETTINGS"
          python3 - "$SETTINGS" <<'PYEOF'
          import os, re, sys
          path = sys.argv[1]
          text = open(path).read()
          if "[resource]" not in text:
              text += "\n[resource]\n"
          values = {
              "export/android/android_sdk_path": os.environ["ANDROID_HOME"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/debug_keystore": os.path.join(os.getcwd(), "debug.keystore"),
              "export/android/debug_keystore_pass": "android",
          }
          for key, val in values.items():
              line = '%s = "%s"' % (key, val)
              if re.search(r'^%s = .*$' % re.escape(key), text, re.M):
                  text = re.sub(r'^%s = .*$' % re.escape(key), line, text, flags=re.M)
              else:
                  text = text.replace("[resource]", "[resource]\n" + line, 1)
          open(path, "w").write(text)
          PYEOF
          grep -E 'android_sdk_path|java_sdk_path' "$SETTINGS"
          grep -E "keystore/debug" export_presets.cfg

      - name: Импорт ресурсов
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --quit-after 5 || true

      - name: Тесты (headless)
        run: godot --headless --path . res://tests/smoke.tscn

      - name: Экспорт APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/iznutri.apk
          ls -lh build/
          test -f build/iznutri.apk

      - name: Переименовать и проверить APK
        run: |
          mkdir -p artifacts
          cp build/iznutri.apk "artifacts/iznutri-${{ github.run_number }}-debug.apk"
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("artifacts/iznutri-${{ github.run_number }}-debug.apk")
          names = z.namelist()
          assert "AndroidManifest.xml" in names, "нет манифеста"
          assert "assets/project.binary" in names, "нет project.binary"
          assert "assets/autoload/game.gdc" in names, "нет скриптов игры"
          assert any(n.startswith("META-INF/") and n.endswith(".RSA") for n in names), "APK не подписан"
          print("APK ok:", len(names), "файлов")
          PY
          ls -lh artifacts

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: iznutri-debug-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: ИЗНУТРИ · сборка ${{ github.run_number }}
          body: |
            Debug-APK из коммита ${{ github.sha }}.

            Установка: скачайте файл, разрешите установку из неизвестного
            источника и откройте APK. Подпись отладочная — для тестов,
            для Google Play нужен release-keystore.
          files: artifacts/*.apk
          draft: false
          prerelease: false